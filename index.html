<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVERTIME: Arcade Brutality - 16-Bit Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #050508;
            color: #f0e6d2;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 6px;
            font-size: 1.3rem;
            color: #ff0055;
            text-shadow: 2px 2px 0px #000, 0 0 10px rgba(255, 0, 85, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        #game-wrapper {
            position: relative;
            border: 4px solid #222233;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), 0 0 15px rgba(255, 0, 85, 0.3);
            background: #000;
        }
        canvas { display: block; background: #000; image-rendering: pixelated; }
        .controls-bar {
            margin-top: 8px;
            font-size: 0.76rem;
            color: #a0a0b0;
            text-align: center;
            max-width: 800px;
            line-height: 1.4;
        }
        .controls-bar span { color: #00ffff; font-weight: bold; }
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>OVERTIME: ARCADE BRUTALITY (DEMONIC EDITION)</h1>
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="800" height="450"></canvas>
        <div class="scanlines"></div>
    </div>
    <div class="controls-bar">
        <span>MOVER:</span> A/D ou Setas | <span>PULAR:</span> W/Espaço | <span>DESCER:</span> S/Baixo | <span>GOLPE:</span> Z/J | <span>MALETA:</span> X/K | <span>DASH:</span> C/L | <span style="color:#ff007f;">ESPECIAL:</span> V/I | <span style="color:#ffff00;">FULLSCREEN:</span> TECLA 0
    </div>

<script>
class RetroAudioEngine {
    constructor() { this.ctx = null; }
    init() {
        if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        }
    }
    playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(240, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    }
    playExplosion() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(15, this.ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.55, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.35);
    }
    playBoomerang() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
    }
    playSpecialCharge() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(250, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.5);
    }
    playItem() {
        if (!this.ctx) return;
        [523, 659, 783, 1046].forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, this.ctx.currentTime + idx * 0.04);
            gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.04);
            osc.stop(this.ctx.currentTime + 0.18);
        });
    }
}
const audio = new RetroAudioEngine();

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const STATE_MENU = 0, STATE_PLAYING = 1, STATE_GAMEOVER = 2, STATE_STAGE_CLEAR = 3, STATE_VICTORY_ALL = 4;
let gameState = STATE_MENU;
let currentStage = 1, unlockedStage = 1, cameraX = 0, cameraY = 0, flashEffect = 0;

const keys = {};
window.addEventListener("keydown", (e) => {
    audio.init();
    keys[e.code] = true;
    
    if (e.code === "Digit0" || e.code === "Numpad0") {
        if (!document.fullscreenElement) {
            document.getElementById("game-wrapper").requestFullscreen().catch(err => {});
        } else {
            document.exitFullscreen().catch(err => {});
        }
    }

    if (gameState === STATE_MENU && e.code === "Enter") {
        gameState = STATE_PLAYING;
        initStage(currentStage);
    } else if (gameState === STATE_STAGE_CLEAR && e.code === "Enter") {
        if (currentStage < 20) {
            currentStage++;
            unlockedStage = Math.max(unlockedStage, currentStage);
            initStage(currentStage);
            gameState = STATE_PLAYING;
        } else {
            gameState = STATE_VICTORY_ALL;
        }
    } else if ((gameState === STATE_GAMEOVER || gameState === STATE_VICTORY_ALL) && e.code === "Enter") {
        currentStage = 1;
        gameState = STATE_MENU;
    }
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

const STAGE_CONFIGS = [];
const BOSS_NAMES = ["MUTANTE CARNIFICINA", "EXAMINADOR DE FERRO", "TERRY DEMÔNIO", "ESPECTRO BIOLÓGICO", "WARHEAD SUPREMO", "GUARDIÃO DO ABISMO", "MOLOCH DA FORNALHA", "GENERAL DAS TREVAS"];
for (let i = 1; i <= 20; i++) {
    STAGE_CONFIGS.push({
        name: "FASE " + i + ": SETOR INFERNAL " + i,
        bg: i % 2 === 0 ? "#160505" : "#090511",
        sky: i % 2 === 0 ? "#380a0a" : "#1b092b",
        boss: BOSS_NAMES[(i-1) % BOSS_NAMES.length],
        hp: 400 + (i * 150),
        color: i % 2 === 0 ? "#ff3300" : "#ff0055"
    });
}

let player = {
    x: 100, y: 260, w: 28, h: 54,
    vx: 0, vy: 0, speed: 5.5,
    hp: 100, maxHp: 100,
    stamina: 100, maxStamina: 100,
    facing: 1, grounded: false,
    attackTimer: 0,
    isDashing: false, dashTimer: 0,
    score: 0, damage: 35, animFrame: 0,
    idleTimer: 0, isIdleLooking: false,
    distance: 0,
    killsCount: 0, requiredKills: 25,
    specialActive: false, specialTimer: 0, specialChargeAnim: 0,
    damageBoostTimer: 0
};

let platforms = [], enemies = [], projectiles = [], particles = [], items = [], clouds = [];
let boomerang = null, boss = null, stagePortal = null, lastGeneratedX = 0;
const STAGE_BOSS_X = 5000;

function initClouds() {
    clouds = [];
    for (let i = 0; i < 15; i++) {
        clouds.push({ x: Math.random() * 6000, y: 20 + Math.random() * 80, w: 90 + Math.random() * 130, h: 30 + Math.random() * 20, speed: 0.2 + Math.random() * 0.3 });
    }
}

function spawnEnemies(x, floorY, width, locationType) {
    if (width < 150) return;
    const enemyCount = Math.min(4, 2 + Math.floor(currentStage * 0.25));
    const spacing = width / (enemyCount + 1);

    for (let e = 0; e < enemyCount; e++) {
        let type = locationType === 'underground' ? (Math.random() > 0.6 ? 'mini_boss' : 'demon_imp') : (Math.random() > 0.5 ? 'hell_knight' : 'demon_grunt');
        let hpMult = type === 'mini_boss' ? 3.5 : (type === 'hell_knight' ? 2.0 : 1.2);
        let ew = type === 'mini_boss' ? 44 : 32;
        let eh = type === 'mini_boss' ? 66 : 54;

        enemies.push({
            x: x + spacing * (e + 1), y: floorY - eh, w: ew, h: eh,
            hp: (60 + currentStage * 22) * hpMult, maxHp: (60 + currentStage * 22) * hpMult,
            type: type,
            vx: (Math.random() > 0.5 ? 1 : -1) * (type === 'mini_boss' ? 1.2 : 2.1),
            facing: -1, animFrame: Math.random() * 10, hitTimer: 0,
            patrolMin: x + 10, patrolMax: x + width - ew - 10
        });
    }
}

function generateProceduralTerrain(fromX, toX) {
    let currentX = fromX;
    while (currentX < toX) {
        let isUnderground = (Math.random() > 0.45 && currentX > 500 && currentX < STAGE_BOSS_X - 1000);

        if (!isUnderground) {
            let w = 500 + Math.random() * 350;
            platforms.push({ x: currentX, y: 340, w: w, h: 200, type: 'surface' });
            spawnEnemies(currentX, 340, w, 'surface');

            if (Math.random() > 0.5) {
                const types = ['coffee', 'heal', 'relic'];
                items.push({ x: currentX + w/2, y: 310, w: 20, h: 20, type: types[Math.floor(Math.random() * types.length)], bob: 0 });
            }
            currentX += w + 80;
        } else {
            let surfW1 = 350 + Math.random() * 150;
            let gapW = 550 + Math.random() * 150;
            let surfW2 = 350 + Math.random() * 150;

            platforms.push({ x: currentX, y: 340, w: surfW1, h: 200, type: 'surface' });
            platforms.push({ x: currentX + surfW1 + gapW, y: 340, w: surfW2, h: 200, type: 'surface' });

            platforms.push({ x: currentX + surfW1 + gapW/2 - 40, y: 0, w: 80, h: 300, type: 'hanging_debris' });

            let underX = currentX + surfW1 - 100;
            let underW = gapW + 200;
            platforms.push({ x: underX, y: 560, w: underW, h: 100, type: 'underground' });

            platforms.push({ x: currentX + surfW1 + 30, y: 410, w: 80, h: 16, type: 'girder' });
            platforms.push({ x: currentX + surfW1 + 150, y: 480, w: 80, h: 16, type: 'girder' });
            platforms.push({ x: currentX + surfW1 + gapW - 230, y: 480, w: 80, h: 16, type: 'girder' });
            platforms.push({ x: currentX + surfW1 + gapW - 110, y: 410, w: 80, h: 16, type: 'girder' });

            spawnEnemies(underX + 100, 560, underW - 200, 'underground');
            currentX += surfW1 + gapW + surfW2 + 80;
        }
    }
    lastGeneratedX = toX;
}

function initStage(stageIdx) {
    const config = STAGE_CONFIGS[stageIdx - 1];
    player.x = 100; player.y = 260; player.vx = 0; player.vy = 0;
    player.hp = Math.min(player.maxHp, player.hp + 30);
    player.distance = 0; player.idleTimer = 0; player.isIdleLooking = false;
    player.damageBoostTimer = 0;
    cameraX = 0; cameraY = 0;

    projectiles = []; particles = []; items = []; enemies = []; platforms = [];
    boomerang = null; stagePortal = null; lastGeneratedX = 0;

    initClouds();

    platforms.push({ x: -100, y: 340, w: 600, h: 200, type: 'surface' });
    platforms.push({ x: STAGE_BOSS_X - 200, y: 340, w: 1200, h: 200, type: 'surface' });
    lastGeneratedX = 500;

    generateProceduralTerrain(500, STAGE_BOSS_X + 200);

    const bossScale = 1.0 + Math.min(0.6, (stageIdx - 1) * 0.03);
    boss = {
        x: STAGE_BOSS_X + 300, y: 240,
        w: 60 * bossScale, h: 84 * bossScale,
        scale: bossScale, hp: config.hp, maxHp: config.hp,
        name: config.boss, color: config.color,
        vx: -1.4, vy: 0, timer: 0, facing: -1,
        active: false, animFrame: 0, hitTimer: 0, defeated: false
    };
}

function spawnFX(x, y, color = "#ff0055", count = 8) {
    for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 5;
        particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, size: 2 + Math.random() * 4, color, life: 1.0, decay: 0.05 });
    }
}

function updateGame() {
    if (gameState !== STATE_PLAYING) return;

    player.animFrame += 0.2;
    player.distance = Math.max(player.distance, Math.floor(player.x));

    clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > cameraX + 900) c.x = cameraX - 200;
    });

    if (player.x + 1600 > lastGeneratedX) generateProceduralTerrain(lastGeneratedX, lastGeneratedX + 1600);

    if (player.specialActive) {
        player.specialTimer--;
        if (player.specialTimer <= 0) { player.specialActive = false; player.killsCount = 0; }
    }
    if (player.damageBoostTimer > 0) player.damageBoostTimer--;
    if (player.specialChargeAnim > 0) player.specialChargeAnim--;

    const isMoving = Math.abs(player.vx) > 0.5 || !player.grounded;
    if (isMoving || keys["KeyZ"] || keys["KeyJ"] || keys["KeyX"] || keys["KeyK"]) {
        player.idleTimer = 0; player.isIdleLooking = false;
    } else {
        player.idleTimer++;
        if (player.idleTimer > 120) player.isIdleLooking = true;
    }

    if (player.isDashing) {
        player.dashTimer--;
        player.vx = player.facing * 10;
        if (player.dashTimer <= 0) player.isDashing = false;
    } else {
        if (keys["ArrowLeft"] || keys["KeyA"]) { player.vx = -player.speed; player.facing = -1; }
        else if (keys["ArrowRight"] || keys["KeyD"]) { player.vx = player.speed; player.facing = 1; }
        else player.vx *= 0.65;

        if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && player.grounded) {
            player.vy = -12; player.grounded = false;
        }

        if ((keys["KeyC"] || keys["KeyL"]) && player.stamina >= 20 && !player.isDashing) {
            player.isDashing = true; player.dashTimer = 14; player.stamina -= 20;
            spawnFX(player.x, player.y + 20, "#00ffff", 6);
        }

        if ((keys["KeyV"] || keys["KeyI"]) && player.killsCount >= player.requiredKills && !player.specialActive) {
            player.specialActive = true; player.specialTimer = 1800; player.specialChargeAnim = 30;
            audio.playSpecialCharge();
            spawnFX(player.x + 16, player.y - 10, "#ff007f", 40); flashEffect = 6;
        }

        if ((keys["KeyZ"] || keys["KeyJ"]) && player.attackTimer <= 0) {
            player.attackTimer = 14;
            const isExplosiveHit = player.specialActive;
            const hitDamage = isExplosiveHit ? 9999 : (player.damage * (player.damageBoostTimer > 0 ? 1.5 : 1.0));

            if (isExplosiveHit) { audio.playExplosion(); spawnFX(player.x + player.facing * 45, player.y + 10, "#ff007f", 25); } 
            else audio.playHit();

            enemies.forEach(en => {
                if (Math.abs((player.x + player.facing * 35) - en.x) < 50 + en.w && Math.abs(player.y - en.y) < 55) {
                    en.hp -= hitDamage; en.hitTimer = 3; en.vx = player.facing * 1.5; player.score += 50;
                    spawnFX(en.x + en.w/2, en.y + en.h/2, isExplosiveHit ? "#ff007f" : "#ff0055", 12);
                }
            });

            if (boss && boss.active && boss.hp > 0 && Math.abs((player.x + player.facing * 35) - boss.x) < 90 && Math.abs(player.y - boss.y) < 65) {
                boss.hp -= isExplosiveHit ? 450 : hitDamage; boss.hitTimer = 3; player.score += 100;
                flashEffect = 3; spawnFX(boss.x + 30, boss.y + 30, isExplosiveHit ? "#ff007f" : "#ff0055", 20);
            }
        }

        if ((keys["KeyX"] || keys["KeyK"]) && !boomerang && player.stamina >= 15) {
            player.stamina -= 15; audio.playBoomerang();
            boomerang = { x: player.x + player.facing * 20, y: player.y + 10, vx: player.facing * 11, returning: false, startX: player.x, pink: player.specialActive };
        }
    }

    if (player.attackTimer > 0) player.attackTimer--;
    if (player.stamina < player.maxStamina) player.stamina += 0.5;

    player.vy += 0.6; player.x += player.vx; player.y += player.vy;

    player.grounded = false;
    platforms.forEach(plat => {
        if (plat.type === 'hanging_debris') {
            if (player.y + player.h > plat.y && player.y < plat.y + plat.h) {
                if (player.x + player.w > plat.x && player.x < plat.x + plat.w) {
                    if (player.vx > 0) player.x = plat.x - player.w;
                    else if (player.vx < 0) player.x = plat.x + player.w;
                }
            }
        } else {
            if (player.x + player.w > plat.x && player.x < plat.x + plat.w) {
                if (player.y + player.h >= plat.y && player.y + player.h <= plat.y + 20 && player.vy >= 0) {
                    if (plat.type === 'girder' && (keys["ArrowDown"] || keys["KeyS"])) {
                        // Passa direto
                    } else {
                        player.y = plat.y - player.h; player.vy = 0; player.grounded = true;
                    }
                }
            }
        }
    });

    if (player.y > 680) {
        player.hp -= 25; player.y = 240; player.vy = 0; spawnFX(player.x, player.y, "#ff0000", 10);
    }

    player.x = Math.max(10, player.x);
    cameraX = Math.max(0, player.x - 280);
    cameraY += ((Math.max(0, player.y - 200)) - cameraY) * 0.08;

    if (boss && !boss.defeated && Math.abs(player.x - boss.x) < 700) boss.active = true;

    enemies.forEach((en, idx) => {
        en.animFrame += 0.15;
        if (en.hitTimer > 0) en.hitTimer--;

        if (en.hp <= 0) {
            if (!player.specialActive && player.killsCount < player.requiredKills) player.killsCount++;
            if (Math.random() > 0.4) items.push({ x: en.x, y: en.y + 10, w: 20, h: 20, type: Math.random() > 0.5 ? 'heal' : 'coffee', bob: 0 });
            enemies.splice(idx, 1);
            player.score += (en.type === 'mini_boss' ? 600 : 250);
            spawnFX(en.x + en.w/2, en.y + en.h/2, "#ff0055", 10); return;
        }

        en.x += en.vx;
        if (en.x <= en.patrolMin || en.x >= en.patrolMax) en.vx *= -1;
        en.facing = Math.sign(en.vx) || -1;

        if (!player.isDashing && Math.hypot((en.x + en.w/2) - (player.x + player.w/2), (en.y + en.h/2) - (player.y + player.h/2)) < 32) {
            player.hp -= (en.type === 'mini_boss' ? 2.5 : 0.8);
            spawnFX(player.x, player.y, "#ff0000", 2);
        }
    });

    if (boomerang) {
        if (!boomerang.returning) {
            boomerang.x += boomerang.vx;
            if (Math.abs(boomerang.x - boomerang.startX) > 350) boomerang.returning = true;
        } else {
            const dx = (player.x + 10) - boomerang.x;
            boomerang.x += Math.sign(dx) * 11;
            if (Math.abs((player.x + 10) - boomerang.x) < 20) boomerang = null;
        }

        if (boomerang) {
            const bDmg = (boomerang.pink ? 9999 : 35) * (player.damageBoostTimer > 0 ? 1.5 : 1.0);
            enemies.forEach(en => {
                if (Math.hypot(boomerang.x - (en.x + en.w/2), boomerang.y - (en.y + en.h/2)) < 32) {
                    en.hp -= bDmg; en.hitTimer = 3; boomerang.returning = true;
                    spawnFX(en.x + en.w/2, en.y + en.h/2, boomerang.pink ? "#ff007f" : "#00ffff", 8);
                }
            });

            if (boss && boss.active && boss.hp > 0 && Math.hypot(boomerang.x - (boss.x+30), boomerang.y - (boss.y+30)) < 50) {
                boss.hp -= boomerang.pink ? 300 : bDmg; boss.hitTimer = 3; boomerang.returning = true;
                spawnFX(boss.x + 30, boss.y + 30, boomerang.pink ? "#ff007f" : "#00ffff", 10);
            }
        }
    }

    if (boss && boss.active && boss.hp > 0) {
        boss.timer++; boss.animFrame += 0.15;
        if (boss.hitTimer > 0) boss.hitTimer--;

        boss.facing = player.x < boss.x ? -1 : 1;
        boss.x += boss.facing * (1.2 + currentStage * 0.08);

        if (boss.timer % Math.max(25, 65 - currentStage * 2) === 0) {
            projectiles.push({ x: boss.x + 20, y: boss.y + 10, vx: boss.facing * 6.5, vy: (Math.random() - 0.5) * 2.5, color: "#ff0055" });
        }

        if (!player.isDashing && Math.hypot((boss.x+30) - player.x, (boss.y+30) - player.y) < 45) {
            player.hp -= 1.2; spawnFX(player.x, player.y, "#ff0000", 3);
        }
    }

    if (boss && boss.active && boss.hp <= 0 && !boss.defeated) {
        boss.defeated = true; boss.active = false; player.score += 4000;
        if (!player.specialActive && player.killsCount < player.requiredKills) player.killsCount = Math.min(player.requiredKills, player.killsCount + 5);
        stagePortal = { x: boss.x + 40, y: 250, w: 60, h: 90 };
        spawnFX(boss.x + 30, boss.y + 30, "#00ffff", 40); audio.playItem();
    }

    if (stagePortal && Math.hypot((player.x + player.w/2) - (stagePortal.x + stagePortal.w/2), (player.y + player.h/2) - (stagePortal.y + stagePortal.h/2)) < 55) {
        audio.playItem(); gameState = STATE_STAGE_CLEAR;
    }

    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i]; p.x += p.vx; p.y += p.vy;
        if (!player.isDashing && Math.hypot(p.x - player.x, p.y - player.y) < 20) {
            player.hp -= 14; projectiles.splice(i, 1); spawnFX(player.x, player.y, "#ff0000", 5);
        } else if (p.x < cameraX - 100 || p.x > cameraX + 900) projectiles.splice(i, 1);
    }

    for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i]; it.bob += 0.08; const currentY = it.y + Math.sin(it.bob) * 4;
        if (Math.hypot(it.x - (player.x + player.w/2), currentY - (player.y + player.h/2)) < 40) {
            audio.playItem();
            if (it.type === 'coffee') player.stamina = player.maxStamina;
            else if (it.type === 'heal') player.hp = Math.min(player.maxHp, player.hp + 40);
            else if (it.type === 'relic') { player.score += 750; player.damageBoostTimer = 600; spawnFX(player.x + 10, player.y, "#d4af37", 20); }
            items.splice(i, 1);
        }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.life -= pt.decay;
        if (pt.life <= 0) particles.splice(i, 1);
    }

    if (player.hp <= 0) gameState = STATE_GAMEOVER;
}

// ================= GRÁFICOS DO PERSONAGEM (KAI) ================= //
function draw16BitKAI(ctx, x, y, facing, attackTimer, isDashing, isIdleLooking, animFrame) {
    ctx.save(); ctx.translate(x + 14, y + 27);
    const isCharging = player.specialChargeAnim > 0;
    const isPinkSpecial = player.specialActive;
    const hasBriefcaseInHand = (boomerang === null);

    if (isIdleLooking) {
        const footTap = Math.sin(animFrame * 1.5) * 4;
        ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.ellipse(0, 26, 14, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1a1a24"; ctx.fillRect(-8, 0, 8, 22); ctx.fillRect(2, 0, 8, 22 - (footTap > 0 ? footTap : 0));
        ctx.fillStyle = "#d00030"; ctx.fillRect(-9, 22, 10, 6); ctx.fillRect(1, 22 + (footTap > 0 ? -footTap : 0), 10, 6);
        ctx.fillStyle = "#7a001a"; ctx.fillRect(-10, -22, 22, 22);
        ctx.fillStyle = "#d00030"; ctx.fillRect(-8, -22, 18, 20);
        ctx.fillStyle = "#e0e0e0"; ctx.fillRect(-3, -22, 8, 20);
        ctx.fillStyle = "#111"; ctx.fillRect(-1, -18, 4, 14);
        ctx.fillStyle = "#ffcdb2"; ctx.fillRect(-7, -36, 16, 14);
        ctx.fillStyle = "#d00030"; ctx.fillRect(-8, -34, 18, 4);
        ctx.fillStyle = isPinkSpecial ? "#ff007f" : "#00e5ff"; ctx.fillRect(-4, -32, 10, 4);
        ctx.fillStyle = "#f9ca24"; ctx.fillRect(-8, -42, 18, 6);
        ctx.restore(); return;
    }

    if (facing === -1) ctx.scale(-1, 1);
    const isMoving = Math.abs(player.vx) > 0.5;
    const legCycle = Math.sin(animFrame * 1.5) * 14;
    const armCycle = Math.cos(animFrame * 1.5) * 12;

    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.beginPath(); ctx.ellipse(0, 27, 14, 5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save(); ctx.translate(-2, 2); ctx.rotate((isMoving ? -legCycle : 0) * Math.PI / 180);
    ctx.fillStyle = "#0c0c12"; ctx.fillRect(-4, 0, 8, 24);
    ctx.fillStyle = "#7a001a"; ctx.fillRect(-5, 20, 10, 6); ctx.restore();

    ctx.save(); ctx.translate(2, 2); ctx.rotate((isMoving ? legCycle : 0) * Math.PI / 180);
    ctx.fillStyle = "#1a1a24"; ctx.fillRect(-4, 0, 8, 24);
    ctx.fillStyle = "#d00030"; ctx.fillRect(-5, 20, 10, 6); ctx.restore();

    ctx.save();
    ctx.rotate(isDashing ? 0.35 : (isMoving ? 0.1 : 0));

    ctx.fillStyle = isDashing ? "#00ffff" : "#7a001a"; ctx.fillRect(-8, -22, 18, 24);
    ctx.fillStyle = isDashing ? "#ffffff" : "#d00030"; ctx.fillRect(-6, -22, 16, 22);
    ctx.fillStyle = "#e0e0e0"; ctx.fillRect(-2, -20, 6, 18);
    ctx.fillStyle = "#111"; ctx.fillRect(0, -18, 3, 14);

    ctx.fillStyle = "#ffcdb2"; ctx.fillRect(-5, -34, 12, 13);
    ctx.fillStyle = "#d00030"; ctx.fillRect(-6, -32, 14, 4);
    ctx.fillStyle = isPinkSpecial ? "#ff007f" : "#00e5ff"; ctx.fillRect(2, -30, 6, 4);
    ctx.fillStyle = "#f9ca24"; ctx.fillRect(-6, -40, 14, 6);

    if (isCharging) {
        ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -300); ctx.lineTo(-8, -180); ctx.lineTo(6, -100); ctx.lineTo(0, -46); ctx.stroke();
        ctx.fillStyle = "rgba(255, 0, 127, 0.5)"; ctx.beginPath(); ctx.arc(0, -46, 28, 0, Math.PI * 2); ctx.fill();
        if (hasBriefcaseInHand) { ctx.fillStyle = "#ff007f"; ctx.fillRect(-8, -56, 18, 22); }
    } else if (attackTimer > 0) {
        ctx.save(); ctx.translate(4, -14); ctx.rotate(-0.5 + ((14 - attackTimer) / 14) * 1.8);
        ctx.fillStyle = "#d00030"; ctx.fillRect(0, -5, 20, 10);
        if (hasBriefcaseInHand) {
            ctx.fillStyle = isPinkSpecial ? "#ff007f" : "#221105"; ctx.fillRect(26, -14, 26, 22);
            ctx.fillStyle = "#ffffff"; ctx.fillRect(34, -18, 10, 5);
        }
        ctx.restore();
    } else {
        ctx.save(); ctx.translate(0, -14); ctx.rotate((isMoving ? armCycle : 0) * Math.PI / 180);
        ctx.fillStyle = "#d00030"; ctx.fillRect(2, -2, 8, 12);
        if (hasBriefcaseInHand) {
            ctx.fillStyle = isPinkSpecial ? "#ff007f" : "#221105"; ctx.fillRect(4, 8, 12, 16);
            if (isPinkSpecial) { ctx.fillStyle = "rgba(255, 0, 127, 0.4)"; ctx.fillRect(2, 6, 16, 20); }
        }
        ctx.restore();
    }
    ctx.restore(); ctx.restore();
}

// ================= INIMIGOS COM CORPO INTEIRO (PERNAS, BRAÇOS, ROSTO E CHIFRES) ================= //
function drawHumanoidEnemy(ctx, en) {
    ctx.save();
    ctx.translate(en.x + en.w/2, en.y + en.h/2);
    if (en.facing === -1) ctx.scale(-1, 1);

    if (en.hitTimer > 0) { ctx.fillStyle = "#ffffff"; ctx.fillRect(-en.w/2, -en.h/2, en.w, en.h); ctx.restore(); return; }

    const isMoving = Math.abs(en.vx) > 0.1;
    const legCycle = Math.sin(en.animFrame * 1.5) * 14;
    const armCycle = Math.cos(en.animFrame * 1.5) * 12;

    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.ellipse(0, en.h/2, en.w/2, 5, 0, 0, Math.PI * 2); ctx.fill();

    if (en.type === 'mini_boss') {
        // Mini-Boss Cyborg Gigante Bípede com Braço Canhão
        ctx.save(); ctx.translate(-4, 12); ctx.rotate((isMoving ? -legCycle : 0) * Math.PI / 180);
        ctx.fillStyle = "#1a1a1a"; ctx.fillRect(-6, 0, 10, 24); ctx.restore();

        ctx.save(); ctx.translate(4, 12); ctx.rotate((isMoving ? legCycle : 0) * Math.PI / 180);
        ctx.fillStyle = "#222"; ctx.fillRect(-6, 0, 10, 24); ctx.restore();

        ctx.fillStyle = "#2a0005"; ctx.fillRect(-18, -20, 36, 32);
        ctx.fillStyle = "#600010"; ctx.fillRect(-16, -18, 32, 28);
        ctx.fillStyle = "#00ffff"; ctx.fillRect(2, -10, 8, 8); // Núcleo peito

        // Cabeça com chifres massivos
        ctx.fillStyle = "#110005"; ctx.fillRect(-10, -38, 20, 18);
        ctx.fillStyle = "#ffff00"; ctx.fillRect(-6, -34, 4, 4); ctx.fillRect(2, -34, 4, 4);
        ctx.fillStyle = "#ff0000";
        ctx.beginPath(); ctx.moveTo(-8, -38); ctx.lineTo(-18, -52); ctx.lineTo(-4, -36); ctx.fill();
        ctx.beginPath(); ctx.moveTo(8, -38); ctx.lineTo(18, -52); ctx.lineTo(4, -36); ctx.fill();

        // Braço Canhão
        ctx.save(); ctx.translate(0, -8); ctx.rotate((isMoving ? armCycle : 0) * Math.PI / 180);
        ctx.fillStyle = "#333"; ctx.fillRect(4, -4, 20, 10);
        ctx.fillStyle = "#ff0000"; ctx.fillRect(20, -2, 4, 6);
        ctx.restore();
    } else {
        // Inimigos Comuns (Hell Knights / Grunts) com Pernas, Braços Articulados e Chifres
        ctx.save(); ctx.translate(-3, 12); ctx.rotate((isMoving ? -legCycle : 0) * Math.PI / 180);
        ctx.fillStyle = "#1a000a"; ctx.fillRect(-4, 0, 7, 22);
        ctx.fillStyle = "#7a001a"; ctx.fillRect(-5, 18, 9, 6); ctx.restore();

        ctx.save(); ctx.translate(3, 12); ctx.rotate((isMoving ? legCycle : 0) * Math.PI / 180);
        ctx.fillStyle = "#2d0014"; ctx.fillRect(-4, 0, 7, 22);
        ctx.fillStyle = "#b3002d"; ctx.fillRect(-5, 18, 9, 6); ctx.restore();

        // Torso
        ctx.fillStyle = en.type === 'hell_knight' ? "#7a001a" : "#2b0a1f"; ctx.fillRect(-12, -14, 24, 26);
        ctx.fillStyle = en.type === 'hell_knight' ? "#b3002d" : "#4a1038"; ctx.fillRect(-10, -12, 20, 22);

        // Cabeça com Rosto Sombrio e Chifres Vermelhos
        ctx.fillStyle = "#0f0005"; ctx.fillRect(-9, -32, 18, 18);
        ctx.fillStyle = "#ff3300"; ctx.fillRect(-5, -28, 4, 3); ctx.fillRect(1, -28, 4, 3); // Olhos
        ctx.fillStyle = "#ffffff"; ctx.fillRect(-3, -22, 6, 3); // Dentes

        // Chifres
        ctx.fillStyle = "#ff0000";
        ctx.beginPath(); ctx.moveTo(-6, -32); ctx.lineTo(-14, -42); ctx.lineTo(-2, -30); ctx.fill();
        ctx.beginPath(); ctx.moveTo(6, -32); ctx.lineTo(14, -42); ctx.lineTo(2, -30); ctx.fill();

        // Braços
        ctx.save(); ctx.translate(0, -8); ctx.rotate((isMoving ? armCycle : 0) * Math.PI / 180);
        ctx.fillStyle = "#7a001a"; ctx.fillRect(6, -3, 8, 14);
        ctx.restore();
    }
    ctx.restore();
}

// ================= BOSSES HUMANÓIDES DEMONÍACOS COM ROSTO E CHIFRES ================= //
function drawHumanoidBoss(ctx, b) {
    if (!b || b.hp <= 0) return;
    ctx.save(); ctx.translate(b.x + b.w/2, b.y + b.h/2);
    if (b.facing === -1) ctx.scale(-1, 1);

    if (b.hitTimer > 0) { ctx.fillStyle = "#ffffff"; ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h); ctx.restore(); return; }

    const breathe = Math.sin(b.animFrame * 0.8) * 3;

    ctx.fillStyle = "rgba(0, 0, 0, 0.7)"; ctx.beginPath(); ctx.ellipse(0, 42, 38, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff0055"; ctx.globalAlpha = 0.2; ctx.beginPath(); ctx.arc(0, -10, 60 + breathe, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1.0;

    // Ombros e Tronco Humanóide Musculoso
    ctx.fillStyle = "#22000a"; ctx.fillRect(-32, -42, 64, 56);
    ctx.fillStyle = b.color; ctx.fillRect(-28, -38, 56, 48);
    ctx.fillStyle = "#ff3300"; ctx.fillRect(-12, -15, 24, 12); // Núcleo infernal no peito

    // Cabeça / Rosto do Chefe com Chifres Gigantescos
    ctx.fillStyle = "#110005"; ctx.fillRect(-26, -72, 52, 36);
    ctx.fillStyle = "#3a0012"; ctx.fillRect(-24, -70, 48, 32);

    // Olhos demoníacos brilhantes
    ctx.fillStyle = "#ffff00"; ctx.fillRect(-14, -62, 10, 6); ctx.fillRect(4, -62, 10, 6);
    ctx.fillStyle = "#ff0000"; ctx.fillRect(-12, -60, 6, 4); ctx.fillRect(6, -60, 6, 4);

    // Boca feroz com dentes
    ctx.fillStyle = "#000000"; ctx.fillRect(-18, -50, 36, 14);
    ctx.fillStyle = "#ffffff";
    for (let dt = -16; dt <= 12; dt += 6) { ctx.fillRect(dt, -48, 4, 6); }

    // Chifres Massivos nas Laterais da Cabeça
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.moveTo(-14, -72); ctx.lineTo(-34, -98); ctx.lineTo(-6, -66); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14, -72); ctx.lineTo(34, -98); ctx.lineTo(6, -66); ctx.fill();
    ctx.fillStyle = "#ff3300";
    ctx.beginPath(); ctx.moveTo(-12, -72); ctx.lineTo(-28, -92); ctx.lineTo(-6, -66); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12, -72); ctx.lineTo(28, -92); ctx.lineTo(6, -66); ctx.fill();

    ctx.restore();
}

function renderGame() {
    ctx.save();
    const config = STAGE_CONFIGS[currentStage - 1];

    let bgGrad = ctx.createLinearGradient(0, 0, 0, 450);
    bgGrad.addColorStop(0, config.sky); bgGrad.addColorStop(1, "#020005");
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === STATE_MENU) {
        ctx.fillStyle = "#ff0055"; ctx.font = "bold 26px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("OVERTIME: ARCADE BRUTALITY", canvas.width / 2, 120);
        ctx.fillStyle = "#00ffff"; ctx.font = "16px 'Courier New'";
        ctx.fillText("16-BIT DEMONIC EDITION - 20 STAGES OF ACTION", canvas.width / 2, 160);
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px 'Courier New'";
        ctx.fillText("[ PRESS ENTER TO START GAME ]", canvas.width / 2, 290);
        ctx.restore(); return;
    }

    ctx.translate(-cameraX, -cameraY);

    // Nuvens de Fumaça Infernal
    ctx.fillStyle = "rgba(255, 50, 85, 0.08)";
    clouds.forEach(c => { ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2); ctx.fill(); });

    // Prédios ao Fundo com Janelas e Luzes Acesas (Estilo Retro Arcade)
    ctx.fillStyle = config.bg;
    for (let i = -300; i < cameraX + 1200; i += 120) {
        const h = 180 + Math.sin(i * 0.05) * 60;
        ctx.fillRect(i, 340 - h, 90, h);
        
        // Desenhar janelas com luzes acesas
        for (let wy = 340 - h + 20; wy < 320; wy += 26) {
            for (let wx = i + 12; wx < i + 75; wx += 22) {
                // Alternar luzes acesas (amarelo/âmbar) e apagadas
                ctx.fillStyle = ((wx + wy + i) % 5 !== 0) ? "rgba(255, 180, 50, 0.45)" : "rgba(30, 20, 25, 0.8)";
                ctx.fillRect(wx, wy, 12, 16);
            }
        }
        ctx.fillStyle = config.bg;
    }

    ctx.fillStyle = "#030305"; ctx.fillRect(cameraX - 100, 340, 1200, 800);

    platforms.forEach(plat => {
        if (plat.type === 'surface') {
            ctx.fillStyle = "#1a080f"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = "#2d050d"; ctx.fillRect(plat.x, plat.y, plat.w, 18);
            ctx.fillStyle = "#ff0055"; ctx.fillRect(plat.x, plat.y + 18, plat.w, 3);
        } else if (plat.type === 'underground') {
            ctx.fillStyle = "#0d0205"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = "#ff3300"; ctx.fillRect(plat.x, plat.y, plat.w, 5); // Lava top
            ctx.fillStyle = "#ffaa00"; const wave = Math.sin(Date.now()*0.005)*4;
            ctx.fillRect(plat.x + plat.w/4, plat.y - 4 + wave, 120, 6);
        } else if (plat.type === 'hanging_debris') {
            ctx.fillStyle = "#1a0a0f"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = "#ff3300"; ctx.fillRect(plat.x + 20, plat.y, 8, plat.h);
        } else if (plat.type === 'girder') {
            ctx.fillStyle = "#331119"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
            ctx.fillStyle = "#ff0055"; ctx.fillRect(plat.x, plat.y, plat.w, 2);
        }
    });

    if (stagePortal) {
        const pulse = Math.sin(Date.now() * 0.01) * 8;
        ctx.fillStyle = "#00ffff"; ctx.fillRect(stagePortal.x - pulse/2, stagePortal.y - pulse/2, stagePortal.w + pulse, stagePortal.h + pulse);
        ctx.fillStyle = "#ffffff"; ctx.fillRect(stagePortal.x + 8, stagePortal.y + 8, stagePortal.w - 16, stagePortal.h - 16);
        ctx.fillStyle = "#00ffff"; ctx.font = "bold 16px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText(">>> PORTAL INFERNAL <<<", stagePortal.x + 30, stagePortal.y - 20); ctx.textAlign = "start";
    }

    items.forEach(it => {
        const currentY = it.y + Math.sin(it.bob) * 4;
        ctx.fillStyle = it.type === 'coffee' ? "#00ffff" : (it.type === 'heal' ? "#00ff66" : "#d4af37");
        ctx.beginPath(); ctx.arc(it.x + 10, currentY + 10, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px 'Courier New'";
        ctx.fillText(it.type === 'coffee' ? "⚡" : (it.type === 'heal' ? "❤" : "★"), it.x + 5, currentY + 14);
    });

    enemies.forEach(en => drawHumanoidEnemy(ctx, en));
    if (boss && boss.active) drawHumanoidBoss(ctx, boss);
    draw16BitKAI(ctx, player.x, player.y, player.facing, player.attackTimer, player.isDashing, player.isIdleLooking, player.animFrame);

    if (boomerang) {
        ctx.fillStyle = boomerang.pink ? "#ff007f" : "#ffffff"; ctx.fillRect(boomerang.x, boomerang.y, 22, 14);
        ctx.fillStyle = boomerang.pink ? "#ff66cc" : "#00ffff"; ctx.fillRect(boomerang.x + 2, boomerang.y + 2, 18, 4);
    }

    projectiles.forEach(p => { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2); ctx.fill(); });
    particles.forEach(pt => { ctx.fillStyle = pt.color; ctx.globalAlpha = pt.life; ctx.fillRect(pt.x, pt.y, pt.size, pt.size); ctx.globalAlpha = 1.0; });
    ctx.restore();

    // HUD
    if (gameState === STATE_PLAYING) {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(10, 10, 430, 85);
        ctx.strokeStyle = "#ff0055"; ctx.strokeRect(10, 10, 430, 85);

        ctx.fillStyle = "#ff0055"; ctx.font = "bold 13px 'Courier New'";
        ctx.fillText(config.name, 20, 26);

        ctx.fillStyle = "#222"; ctx.fillRect(20, 34, 160, 10);
        ctx.fillStyle = "#00ff66"; ctx.fillRect(20, 34, Math.max(0, (player.hp / player.maxHp) * 160), 10);

        ctx.fillStyle = "#222"; ctx.fillRect(20, 48, 160, 8);
        ctx.fillStyle = "#00ffff"; ctx.fillRect(20, 48, Math.max(0, (player.stamina / player.maxStamina) * 160), 8);

        ctx.font = "bold 12px 'Courier New'";
        if (player.specialActive) {
            const secLeft = Math.ceil(player.specialTimer / 60);
            ctx.fillStyle = "#ff007f"; ctx.fillText("MALETA ROSA ATIVA! (" + secLeft + "s)", 20, 70);
        } else if (player.killsCount >= player.requiredKills) {
            ctx.fillStyle = "#ff007f"; ctx.fillText("ESPECIAL PRONTO! PRESSIONE [ V ]", 20, 70);
        } else {
            ctx.fillStyle = "#aaaaaa"; ctx.fillText("ESPECIAL: " + player.killsCount + " / " + player.requiredKills + " KILLS", 20, 70);
        }

        if (player.damageBoostTimer > 0) {
            ctx.fillStyle = "#d4af37"; ctx.fillText("★ SUPER DANO +50% (" + Math.ceil(player.damageBoostTimer / 60) + "s)", 20, 85);
        }

        ctx.fillStyle = "#ffffff"; ctx.font = "12px 'Courier New'";
        ctx.fillText("SCORE: " + player.score, 200, 44); ctx.fillText("DIST: " + player.distance + "m", 200, 58);

        if (boss && boss.active && boss.hp > 0) {
            ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(440, 10, 350, 45); ctx.strokeStyle = "#ff0055"; ctx.strokeRect(440, 10, 350, 45);
            ctx.fillStyle = boss.color; ctx.font = "bold 12px 'Courier New'"; ctx.fillText(boss.name, 450, 26);
            ctx.fillStyle = "#222"; ctx.fillRect(450, 32, 330, 12);
            ctx.fillStyle = "#ff0055"; ctx.fillRect(450, 32, Math.max(0, (boss.hp / boss.maxHp) * 330), 12);
        }
    }

    if (flashEffect > 0) { ctx.fillStyle = "rgba(255, 255, 255, 0.4)"; ctx.fillRect(0, 0, canvas.width, canvas.height); flashEffect--; }

    if (gameState === STATE_STAGE_CLEAR) {
        ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00ffff"; ctx.font = "bold 32px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("FASE " + currentStage + " CONCLUÍDA!", canvas.width / 2, 160);
        ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Courier New'"; ctx.fillText("PONTUAÇÃO ACUMULADA: " + player.score, canvas.width / 2, 220);
        ctx.fillStyle = "#ff0055"; ctx.font = "bold 20px 'Courier New'"; ctx.fillText("[ PRESS ENTER FOR NEXT STAGE ]", canvas.width / 2, 300); ctx.textAlign = "start";
    }

    if (gameState === STATE_GAMEOVER) {
        ctx.fillStyle = "rgba(0,0,0,0.9)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff0055"; ctx.font = "bold 34px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("VOCÊ FOI CONSUMIDO PELO INFERNO", canvas.width / 2, 180);
        ctx.fillStyle = "#ffffff"; ctx.font = "16px 'Courier New'"; ctx.fillText("Pressione [ ENTER ] para recomeçar", canvas.width / 2, 260); ctx.textAlign = "start";
    }

    if (gameState === STATE_VICTORY_ALL) {
        ctx.fillStyle = "rgba(0,0,0,0.92)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#d4af37"; ctx.font = "bold 30px 'Courier New'"; ctx.textAlign = "center";
        ctx.fillText("TODAS AS 20 FASES FORAM PURIFICADAS!", canvas.width / 2, 160);
        ctx.fillStyle = "#00ffff"; ctx.font = "18px 'Courier New'"; ctx.fillText("VOCÊ DERROTOU WARHEAD E O EXÉRCITO DEMONÍACO!", canvas.width / 2, 220);
        ctx.fillText("PONTUAÇÃO FINAL: " + player.score, canvas.width / 2, 260);
        ctx.fillStyle = "#ffffff"; ctx.font = "16px 'Courier New'"; ctx.fillText("Pressione [ ENTER ] para retornar ao Menu", canvas.width / 2, 340); ctx.textAlign = "start";
    }
}

function gameLoop() { updateGame(); renderGame(); requestAnimationFrame(gameLoop); }
gameLoop();
</script>
</body>
</html>
